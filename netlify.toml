[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY, NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_VAPID_PUBLIC_KEY, VAPID_SUBJECT, CRON_SECRET"

# Scheduled Functions (see netlify/functions/*.mjs). Each uses the
# `@netlify/functions` `schedule()` handler; the schedule is declared in the
# function file so no per-function config block is required here.
#   - email-reminders:  */15 * * * *   -> app/api/cron/reminders
#   - daily-report:     0 7 * * *      -> app/api/cron/daily-report

# Static files are served by the CDN, so next.config.ts headers don't reach
# them — set the ones push / installability depend on here.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/favicon/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"
